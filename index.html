<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Encabezado -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">⏱️ Control de Asistencia</h1>
        <button onclick="cambiarVista('admin')" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm transition">Panel Admin</button>
    </header>

    <!-- Contenedor Principal -->
    <main class="container mx-auto p-4 max-w-lg my-auto">

        <!-- VISTA: FICHAJE EMPLEADO -->
        <div id="vista-fichaje" class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Registro de Jornada</h2>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nombre y Apellido:</label>
                <input type="text" id="nombre-empleado" placeholder="Ej. Juan Pérez" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <button onclick="registrarAccion('Entrada')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition shadow text-lg">📥 Entrada</button>
                <button onclick="registrarAccion('Salida')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition shadow text-lg">📤 Salida</button>
            </div>

            <div id="mensaje-alerta" class="hidden p-3 rounded-lg text-center text-sm font-medium mb-4"></div>

            <!-- Sección de Resultado para Copiar y Pegar -->
            <div id="seccion-copiar" class="hidden mt-4 p-4 bg-gray-50 border border-gray-300 rounded-lg">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold text-gray-600 uppercase">Información para copiar:</span>
                    <button onclick="copiarAlPortapapeles()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-1 px-3 rounded transition shadow">📋 Copiar Texto</button>
                </div>
                <div id="texto-resultado" class="bg-white p-3 border rounded text-sm font-mono text-gray-800 select-all whitespace-pre-line"></div>
            </div>

            <!-- Botón de Reiniciar Semana desde la vista principal -->
            <div class="mt-6 pt-4 border-t border-gray-200">
                <button onclick="reiniciarSemana()" class="w-full bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-4 rounded-lg text-sm transition border border-red-300">🔄 Reiniciar la Semana (Borrar Datos)</button>
            </div>
        </div>

        <!-- VISTA: ADMIN -->
        <div id="vista-admin" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Resumen Semanal de Servicio</h2>
                <button onclick="cambiarVista('fichaje')" class="text-blue-600 text-sm hover:underline font-bold">← Volver</button>
            </div>

            <div class="overflow-x-auto max-h-96">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-2 border">Nombre y Apellido</th>
                            <th class="p-2 border">Entrada</th>
                            <th class="p-2 border">Salida</th>
                            <th class="p-2 border">Horas Totales</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros">
                        <!-- Registros -->
                    </tbody>
                </table>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-200">
                <button onclick="reiniciarSemana()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition shadow">⚠️ Reiniciar la Semana (Borrar Todo)</button>
            </div>
        </div>

    </main>

    <footer class="text-center p-4 text-gray-500 text-xs">
        Control de Asistencia &copy; 2026
    </footer>

    <!-- Lógica de Funcionamiento -->
    <script>
        function cambiarVista(vista) {
            if(vista === 'admin') {
                let password = prompt("Introduce la contraseña de administrador:");
                if(password !== "1234") {
                    alert("Contraseña incorrecta");
                    return;
                }
                document.getElementById('vista-fichaje').classList.add('hidden');
                document.getElementById('vista-admin').classList.remove('hidden');
                cargarTablaAdmin();
            } else {
                document.getElementById('vista-admin').classList.add('hidden');
                document.getElementById('vista-fichaje').classList.remove('hidden');
            }
        }

        function registrarAccion(tipo) {
            const nombre = document.getElementById('nombre-empleado').value.trim();
            const alerta = document.getElementById('mensaje-alerta');
            const seccionCopiar = document.getElementById('seccion-copiar');
            const textoResultado = document.getElementById('texto-resultado');

            if(!nombre) {
                alerta.className = "p-3 rounded-lg text-center text-sm font-medium bg-red-100 text-red-700";
                alerta.innerText = "Por favor, ingresa tu Nombre y Apellido.";
                alerta.classList.remove('hidden');
                seccionCopiar.classList.add('hidden');
                return;
            }

            let registros = JSON.parse(localStorage.getItem('fichajes_semanales')) || [];
            const ahora = new Date();
            const timestamp = ahora.getTime();
            const horaTexto = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' (' + ahora.toLocaleDateString() + ')';
            
            let datosFichajeActual = null;

            if (tipo === 'Entrada') {
                const nuevoRegistro = {
                    nombre: nombre,
                    entradaTexto: horaTexto,
                    entradaTime: timestamp,
                    salidaTexto: '',
                    salidaTime: null,
                    horasTotales: ''
                };
                registros.push(nuevoRegistro);
                datosFichajeActual = nuevoRegistro;
                mostrarAlerta(`Entrada registrada para ${nombre}`, 'exito');
            } else if (tipo === 'Salida') {
                let registroAbierto = registros.slice().reverse().find(r => r.nombre.toLowerCase() === nombre.toLowerCase() && !r.salidaTime);

                if (!registroAbierto) {
                    mostrarAlerta(`No hay registro de entrada activo para ${nombre}.`, 'error');
                    seccionCopiar.classList.add('hidden');
                    return;
                }

                registroAbierto.salidaTexto = horaTexto;
                registroAbierto.salidaTime = timestamp;

                const diferenciaMs = timestamp - registroAbierto.entradaTime;
                const horas = (diferenciaMs / (1000 * 60 * 60)).toFixed(2);
                registroAbierto.horasTotales = `${horas} hrs`;

                datosFichajeActual = registroAbierto;
                mostrarAlerta(`Salida registrada para ${nombre}. Total: ${horas} hrs`, 'exito');
            }

            localStorage.setItem('fichajes_semanales', JSON.stringify(registros));

            // Mostrar el bloque listo para copiar y pegar
            if (datosFichajeActual) {
                const textoFormateado = 
`- **Nombre y Apellido:** ${datosFichajeActual.nombre}
- **Entrada:** ${datosFichajeActual.entradaTexto}
- **Salida:** ${datosFichajeActual.salidaTexto}
- **Horas totales en servicio:** ${datosFichajeActual.horasTotales}`;

                textoResultado.innerText = textoFormateado;
                seccionCopiar.classList.remove('hidden');
            }
        }

        function copiarAlPortapapeles() {
            const texto = document.getElementById('texto-resultado').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                alert("¡Información copiada al portapapeles!");
            }).catch(err => {
                alert("No se pudo copiar automáticamente. Puedes seleccionarlo y copiarlo manualmente.");
            });
        }

        function mostrarAlerta(texto, tipo) {
            const alerta = document.getElementById('mensaje-alerta');
            alerta.innerText = texto;
            if (tipo === 'exito') {
                alerta.className = "p-3 rounded-lg text-center text-sm font-medium bg-green-100 text-green-700";
            } else {
                alerta.className = "p-3 rounded-lg text-center text-sm font-medium bg-red-100 text-red-700";
            }
            alerta.classList.remove('hidden');
        }

        function cargarTablaAdmin() {
            const tbody = document.getElementById('tabla-registros');
            tbody.innerHTML = '';
            let registros = JSON.parse(localStorage.getItem('fichajes_semanales')) || [];

            if(registros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">No hay registros esta semana.</td></tr>`;
                return;
            }

            registros.forEach(reg => {
                let tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="p-2 border font-medium">${reg.nombre}</td>
                    <td class="p-2 border text-gray-600">${reg.entradaTexto}</td>
                    <td class="p-2 border text-gray-600">${reg.salidaTexto}</td>
                    <td class="p-2 border font-bold text-blue-700">${reg.horasTotales}</td>
                `;
                tbody.appendChild(tr);
            });
