<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Fichaje</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Encabezado -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">⏱️ Control de Asistencia</h1>
        <button onclick="cambiarVista('admin')" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-sm transition">Panel Admin</button>
    </header>

    <!-- Contenedor Principal -->
    <main class="container mx-auto p-4 max-w-md my-auto">

        <!-- VISTA: FICHAJE EMPLEADO -->
        <div id="vista-fichaje" class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Registro de Jornada</h2>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nombre o PIN del Empleado:</label>
                <input type="text" id="nombre-empleado" placeholder="Ej. Juan Pérez o 1234" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="registrarFichaje('Entrada')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition shadow">📥 Entrada</button>
                <button onclick="registrarFichaje('Salida a Comer')" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-4 rounded-lg transition shadow">🍔 Salida Comer</button>
                <button onclick="registrarFichaje('Regreso de Comer')" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition shadow">🔄 Regreso Comer</button>
                <button onclick="registrarFichaje('Salida')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition shadow">📤 Salida</button>
            </div>

            <div id="mensaje-alerta" class="hidden p-3 rounded-lg text-center text-sm font-medium"></div>
        </div>

        <!-- VISTA: ADMIN -->
        <div id="vista-admin" class="bg-white p-6 rounded-xl shadow-md hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Panel de Administración</h2>
                <button onclick="cambiarVista('fichaje')" class="text-blue-600 text-sm hover:underline">← Volver</button>
            </div>

            <div class="overflow-x-auto max-h-96">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-200 text-gray-700">
                            <th class="p-2 border">Empleado</th>
                            <th class="p-2 border">Acción</th>
                            <th class="p-2 border">Fecha y Hora</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros">
                        <!-- Se llena dinámicamente -->
                    </tbody>
                </table>
            </div>

            <button onclick="limpiarRegistros()" class="mt-4 w-full bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-4 rounded-lg text-sm transition">Borrar Historial</button>
        </div>

    </main>

    <footer class="text-center p-4 text-gray-500 text-xs">
        Sistema de Fichaje &copy; 2026
    </footer>

    <!-- Lógica del Sistema -->
    <script>
        function cambiarVista(vista) {
            if(vista === 'admin') {
                let password = prompt("Introduce la contraseña de administrador:");
                if(password !== "1234") { // Contraseña de admin por defecto
                    alert("Contraseña incorrecta");
                    return;
                }
                document.getElementById('vista-fichaje').classList.add('hidden');
                document.getElementById('vista-admin').classList.remove('hidden');
                cargarRegistrosTabla();
            } else {
                document.getElementById('vista-admin').classList.add('hidden');
                document.getElementById('vista-fichaje').classList.remove('hidden');
            }
        }

        function registrarFichaje(accion) {
            const nombre = document.getElementById('nombre-empleado').value.trim();
            const alerta = document.getElementById('mensaje-alerta');

            if(!nombre) {
                alerta.className = "p-3 rounded-lg text-center text-sm font-medium bg-red-100 text-red-700";
                alerta.innerText = "Por favor ingresa tu nombre o PIN.";
                alerta.classList.remove('hidden');
                return;
            }

            const ahora = new Date();
            const fechaHoraStr = ahora.toLocaleString();

            let registros = JSON.parse(localStorage.getItem('fichajes')) || [];
            registros.unshift({ nombre, accion, fechaHora: fechaHoraStr });
            localStorage.setItem('fichajes', JSON.stringify(registros));

            alerta.className = "p-3 rounded-lg text-center text-sm font-medium bg-green-100 text-green-700";
            alerta.innerText = `¡Registrado con éxito: ${accion} (${fechaHoraStr})!`;
            alerta.classList.remove('hidden');

            document.getElementById('nombre-empleado').value = '';
            setTimeout(() => alerta.classList.add('hidden'), 4000);
        }

        function cargarRegistrosTabla() {
            const tbody = document.getElementById('tabla-registros');
            tbody.innerHTML = '';
            let registros = JSON.parse(localStorage.getItem('fichajes')) || [];

            if(registros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">No hay fichajes registrados.</td></tr>`;
                return;
            }

            registros.forEach(reg => {
                let tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50";
                tr.innerHTML = `<td class="p-2 border">${reg.nombre}</td>
                                <td class="p-2 border font-semibold">${reg.accion}</td>
                                <td class="p-2 border text-gray-600">${reg.fechaHora}</td>`;
                tbody.appendChild(tr);
            });
        }

        function limpiarRegistros() {
            if(confirm("¿Estás seguro de borrar todo el historial de fichajes?")) {
                localStorage.removeItem('fichajes');
                cargarRegistrosTabla();
            }
        }
    </script>
</body>
</html>
